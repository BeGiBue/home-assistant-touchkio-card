name: Release after validated main

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Publish verified version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          # Kartendatei laut hacs.json (HACS lädt sie aus dem Release)
          FILE="$(node -p "require('./hacs.json').filename")"
          test -s "$FILE"
          grep -Fq "\"$VERSION\"" "$FILE" || { echo "Version constant in $FILE does not match $VERSION" >&2; exit 1; }
          node --check "$FILE"
          # Release-Text: Abschnitt "## x.y.z" aus der CHANGELOG.md
          NOTES="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$NOTES"
          grep -q '[^[:space:]]' "$NOTES" || { echo "No section \"## $VERSION\" with content in CHANGELOG.md" >&2; exit 1; }
          gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$TAG" --notes-file "$NOTES" --latest
